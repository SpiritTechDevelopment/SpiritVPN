# Локальное превью сайта документации.
#
# Тот же образ, которым сайт собирается в CI, поэтому увиденное здесь совпадает с
# тем, что опубликуется на GitHub Pages: навигация, поиск и тема берутся из
# mkdocs.yml, а не из умолчаний просмотрщика markdown.
#
# Каталог репозитория монтируется целиком, потому что mkdocs.yml лежит в его
# корне, а docs/ указан в нём как docs_dir. Правки в docs/*.md подхватываются на
# лету, без пересборки контейнера.
#
# База данных живёт в отдельном docker-compose.dev.yml: она одноразовая, её
# поднимают на время тестов и гасят, а превью документации переживает их без
# перезапуска. Держать оба сервиса в одном файле значило бы гасить один вместе с
# другим.

services:
  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: spiritvpn-docs
    restart: unless-stopped
    ports:
      # 8081 снаружи: 8000 занимают слишком многие инструменты разработки.
      - "8081:8000"
    volumes:
      - ./:/docs
