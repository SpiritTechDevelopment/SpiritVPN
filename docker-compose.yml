version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: spiritvpn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spiritdb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      POSTGRES_DB: spiritdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spiritvpn

# Документация (MkDocs)
  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: spiritvpn-docs
    restart: unless-stopped
    ports:
      - "8081:8000" 
    volumes:
      - ./:/docs 

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: spiritvpn-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - spiritvpn

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: spiritvpn-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - spiritvpn

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  spiritvpn:
    driver: bridge
