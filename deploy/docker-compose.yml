# Развёртывание spiritvpnd на сервере среды.
#
# Файл один на обе среды. Различия между ними — база, сертификаты, ключ
# шифрования, тег образа — приходят из .env рядом с этим файлом; сам .env лежит
# только на сервере и в репозиторий не попадает.
#
# Поднимать через deploy.sh, а не напрямую: он держит порядок «схема раньше
# процесса». Под docker compose нарушение этого порядка не ловится ничем —
# gRPC-поверхность открывается независимо от /health/ready, и процесс на схеме
# старше встроенной начнёт принимать вызовы, роняя их на SQL-запросах.

services:
  spiritvpnd:
    image: ${SPIRITVPN_REGISTRY:?задайте SPIRITVPN_REGISTRY в .env}/spiritvpn-spiritvpnd:${SPIRITVPN_TAG:?задайте SPIRITVPN_TAG в .env}
    container_name: spiritvpnd
    restart: unless-stopped

    # Процесс отводит на graceful shutdown 20 секунд (shutdownTimeout в
    # cmd/spiritvpnd/main.go). Значение Docker по умолчанию — 10, и затянувшийся
    # RPC получил бы SIGKILL раньше, чем процесс истратит свой бюджет.
    stop_grace_period: 30s

    env_file:
      - .env

    ports:
      # Только gRPC под mTLS. Служебный порт 8080 наружу не выставляется: TLS и
      # проверки вызывающего у него нет, а /metrics отдаёт состав флота, объёмы
      # трафика и глубину очередей.
      - "8443:8443"

    volumes:
      # Шесть файлов mTLS и файл ключа шифрования. Пути внутрь контейнера задают
      # переменные SPIRIT_* в .env. Каталог обязан быть читаем uid 10001: под ним
      # идёт процесс в образе.
      - ./secrets:/secrets:ro

    healthcheck:
      # Показывает состояние в docker ps и ничего не гасит: трафик на gRPC идёт
      # независимо от результата этой проверки. Готовность здесь для оператора.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
