codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        threshold: 5%
        informational: true

    patch:
      default:
        target: 80%
        threshold: 5%
        informational: false

comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "test/**/*"
  - "cmd/**/*"
  - "**/*_test.go"
  - "deployments/**/*"
  - "scripts/**/*"
