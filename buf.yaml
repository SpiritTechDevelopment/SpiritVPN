version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # Вендоренный контракт, которым владеет infra: не подчиняется нашим правилам линта.
  ignore:
    - proto/spiritvpn/nodeagent
breaking:
  use:
    - FILE
  # Вендоренный контракт из ignore НЕ исключён, в отличие от линта. Стиль infra
  # действительно не наш, а вот совместимость — наша: копия node-agent лежит в
  # этом репозитории, и её обновление ломает клиента агента молча. §18 требует
  # compatibility tests всех трёх контрактов, node-agent в их числе.
