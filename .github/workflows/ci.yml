name: CI/CD Pipeline

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Гейт интеграционных тестов адаптера postgres. Без обеих переменных они
      # пропускаются, и `go test ./...` остаётся офлайновым.
      SPIRITVPN_INTEGRATION_TESTS: "1"
      DATABASE_URL: "postgres://spiritdb:your_secure_password@localhost:5432/spiritdb?sslmode=disable"

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: spiritdb
          POSTGRES_PASSWORD: your_secure_password
          POSTGRES_DB: spiritdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spiritdb -d spiritdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Restore coverage cache
      uses: actions/cache/restore@v5
      with:
        path: coverage_cache.txt
        key: coverage-${{ github.ref }}-
        restore-keys: |
          coverage-${{ github.ref }}-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        fail_ci_if_error: false
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

    - name: Generate coverage report
      run: go tool cover -html=coverage.out -o coverage.html

    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      with:
        name: coverage-report
        path: coverage.html

    # Гейт, а не предупреждение. Стоит ПОСЛЕ выгрузки отчёта намеренно: падение
    # шага пропускает все последующие без `if: always()`, и отчёт исчезал бы
    # ровно тогда, когда по нему надо разбираться, почему покрытие просело.
    #
    # Порог 80 при фактических 83.7% (интеграционные в этой job включены, иначе
    # postgres даёт 3.6% и общая цифра не имеет смысла). Запас в три пункта —
    # чтобы гейт ловил снятые тесты, а не шум от пары новых строк.
    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        # Пустая строка здесь означала бы, что профиль не разобрался; без этой
        # проверки `bc` получает пустое выражение, и гейт молча пропускает.
        if [ -z "$COVERAGE" ]; then
          echo "Failed to parse total coverage from coverage.out"
          exit 1
        fi
        echo "Current coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          echo "Coverage $COVERAGE% is below the 80% threshold"
          exit 1
        fi
        echo "Great! Coverage $COVERAGE% meets the 80% threshold"

    - name: Send coverage report to Telegram
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
        PREV_COVERAGE=""
        if [ -f coverage_cache.txt ]; then
          PREV_COVERAGE=$(cat coverage_cache.txt)
        fi
        echo "$COVERAGE" > coverage_cache.txt
        STATUS="Passed"
        if [ "${{ job.status }}" != "success" ]; then
          STATUS="Failed"
        fi
        if [ "$COVERAGE" == "$PREV_COVERAGE" ] && [ -n "$PREV_COVERAGE" ] && [ "$STATUS" == "Passed" ]; then
          exit 0
        fi
        if [ -n "${{ github.head_ref }}" ]; then
          BRANCH="${{ github.head_ref }} → ${{ github.base_ref }}"
        else
          BRANCH="${GITHUB_REF#refs/heads/}"
        fi
        COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
        COMMIT_SHA=${GITHUB_SHA::7}
        COVERAGE_CHANGE=""
        if [ -n "$PREV_COVERAGE" ]; then
          PREV_NUM=$(echo "$PREV_COVERAGE" | sed 's/%//')
          CURR_NUM=$(echo "$COVERAGE" | sed 's/%//')
          DIFF=$(echo "$CURR_NUM - $PREV_NUM" | bc)
          if (( $(echo "$DIFF > 0" | bc -l) )); then
            COVERAGE_CHANGE=" +${DIFF}%"
          elif (( $(echo "$DIFF < 0" | bc -l) )); then
            COVERAGE_CHANGE=" ${DIFF}%"
          fi
        fi
        MESSAGE=$'*Coverage Report*\n\n*Project:* SpiritVPN\n*Branch:* '"$BRANCH"$'\n*Commit:* '"$COMMIT_SHA"$'\n*Coverage:* '"$COVERAGE$COVERAGE_CHANGE"$'\n*Status:* '"$STATUS"$'\n\n_'"$COMMIT_MSG"$'_\n\n[View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" -d message_thread_id="18" -d text="${MESSAGE}" -d parse_mode="Markdown"
        fi

    - name: Save coverage cache
      if: always()
      uses: actions/cache/save@v5
      with:
        path: coverage_cache.txt
        key: coverage-${{ github.ref }}-${{ github.sha }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Build all packages
      run: go build -v ./...

    - name: Verify protobuf generated code is up to date
      run: |
        go tool buf lint
        go tool buf generate
        git diff --exit-code -- internal/gen

    - name: Verify sqlc generated code is up to date
      run: |
        go tool sqlc generate
        git diff --exit-code -- internal/postgres/db

  images:
    name: Images
    runs-on: ubuntu-latest
    needs: [build]

    # Только ветки сред и релизные теги. Триггер workflow — push в любую ветку,
    # и без этого условия каждая feature-ветка складывала бы в registry по паре
    # образов.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.names.outputs.tag }}
      owner: ${{ steps.names.outputs.owner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Compute image names
      id: names
      run: |
        # Имена образов в ghcr обязаны быть строчными, а владелец репозитория
        # записан как SpiritTechDevelopment.
        echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
        echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Оба образа выходят из одной стадии сборки и несут один тег. Разъехавшиеся
    # теги дают процесс, застрявший в `not ready: schema`, причём ни одна
    # миграция при этом не падает: он требует схему не ниже встроенной в него.
    - name: Build and push migrate
      uses: docker/build-push-action@v6
      with:
        context: .
        target: migrate
        push: true
        tags: ghcr.io/${{ steps.names.outputs.owner }}/spiritvpn-migrate:${{ steps.names.outputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push spiritvpnd
      uses: docker/build-push-action@v6
      with:
        context: .
        target: spiritvpnd
        push: true
        tags: ghcr.io/${{ steps.names.outputs.owner }}/spiritvpn-spiritvpnd:${{ steps.names.outputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Выкатка обеих сред идёт отсюда, на серверы никто не заходит руками.
  #
  # Доступы разведены по GitHub Environments: секреты с одинаковыми именами
  # разрешаются в разные значения, и ключ от production недоступен job'у,
  # который выкатывает develop.
  #
  # deploy.sh на сервере держит порядок трёх шагов — схему раньше процесса.

  deploy-develop:
    name: Deploy develop
    runs-on: ubuntu-latest
    needs: [images]
    if: github.ref == 'refs/heads/develop'
    environment: develop
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Compose-файл и скрипт едут на сервер каждой выкаткой. Иначе их правки в
    # репозитории нужно было бы разносить по серверам отдельно, и версия скрипта
    # там расходилась бы с версией образа молча. Заполненный .env и каталог
    # secrets/ лежат только на сервере, копирование их не трогает.
    - name: Copy deploy files
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        source: deploy/docker-compose.yml,deploy/deploy.sh
        target: /srv/spiritvpn
        strip_components: 1

    - name: Run deploy.sh over SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        script: |
          chmod +x /srv/spiritvpn/deploy.sh
          /srv/spiritvpn/deploy.sh ${{ needs.images.outputs.tag }}

  # Продакшн выкатывается тегом v*, а не мержем в main: экземпляр один, замена
  # контейнера означает недоступность gRPC, и момент простоя выбирается тегом.
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: [images]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Compose-файл и скрипт едут на сервер каждой выкаткой. Иначе их правки в
    # репозитории нужно было бы разносить по серверам отдельно, и версия скрипта
    # там расходилась бы с версией образа молча. Заполненный .env и каталог
    # secrets/ лежат только на сервере, копирование их не трогает.
    - name: Copy deploy files
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        source: deploy/docker-compose.yml,deploy/deploy.sh
        target: /srv/spiritvpn
        strip_components: 1

    - name: Run deploy.sh over SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        script: |
          chmod +x /srv/spiritvpn/deploy.sh
          /srv/spiritvpn/deploy.sh ${{ needs.images.outputs.tag }}
