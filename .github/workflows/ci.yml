name: CI/CD Pipeline

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SPIRITVPN_INTEGRATION_TESTS: "1"

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: spiritdb
          POSTGRES_PASSWORD: your_secure_password
          POSTGRES_DB: spiritdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spiritdb -d spiritdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Restore coverage cache
      uses: actions/cache/restore@v5
      with:
        path: coverage_cache.txt
        key: coverage-${{ github.ref }}-
        restore-keys: |
          coverage-${{ github.ref }}-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Current coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          echo "Warning: Coverage $COVERAGE% is below 80% threshold"
        else
          echo "Great! Coverage $COVERAGE% meets the 80% threshold"
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        fail_ci_if_error: false
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

    - name: Generate coverage report
      run: go tool cover -html=coverage.out -o coverage.html

    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      with:
        name: coverage-report
        path: coverage.html

    - name: Send coverage report to Telegram
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
        PREV_COVERAGE=""
        if [ -f coverage_cache.txt ]; then
          PREV_COVERAGE=$(cat coverage_cache.txt)
        fi
        echo "$COVERAGE" > coverage_cache.txt
        STATUS="Passed"
        if [ "${{ job.status }}" != "success" ]; then
          STATUS="Failed"
        fi
        if [ "$COVERAGE" == "$PREV_COVERAGE" ] && [ -n "$PREV_COVERAGE" ] && [ "$STATUS" == "Passed" ]; then
          exit 0
        fi
        if [ -n "${{ github.head_ref }}" ]; then
          BRANCH="${{ github.head_ref }} → ${{ github.base_ref }}"
        else
          BRANCH="${GITHUB_REF#refs/heads/}"
        fi
        COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
        COMMIT_SHA=${GITHUB_SHA::7}
        COVERAGE_CHANGE=""
        if [ -n "$PREV_COVERAGE" ]; then
          PREV_NUM=$(echo "$PREV_COVERAGE" | sed 's/%//')
          CURR_NUM=$(echo "$COVERAGE" | sed 's/%//')
          DIFF=$(echo "$CURR_NUM - $PREV_NUM" | bc)
          if (( $(echo "$DIFF > 0" | bc -l) )); then
            COVERAGE_CHANGE=" +${DIFF}%"
          elif (( $(echo "$DIFF < 0" | bc -l) )); then
            COVERAGE_CHANGE=" ${DIFF}%"
          fi
        fi
        MESSAGE=$'*Coverage Report*\n\n*Project:* SpiritVPN\n*Branch:* '"$BRANCH"$'\n*Commit:* '"$COMMIT_SHA"$'\n*Coverage:* '"$COVERAGE$COVERAGE_CHANGE"$'\n*Status:* '"$STATUS"$'\n\n_'"$COMMIT_MSG"$'_\n\n[View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" -d message_thread_id="18" -d text="${MESSAGE}" -d parse_mode="Markdown"
        fi

    - name: Save coverage cache
      if: always()
      uses: actions/cache/save@v5
      with:
        path: coverage_cache.txt
        key: coverage-${{ github.ref }}-${{ github.sha }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Build API Server
      run: go build -v ./cmd/api-server

    - name: Build VPN Server
      run: go build -v ./cmd/vpn-server

  container-smoke:
    name: Backend Container Smoke
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build backend image
      run: docker build --file deployments/api.Dockerfile --tag spiritvpn-api:ci .

    - name: Start isolated dependencies
      run: |
        docker network create spiritvpn-ci
        docker run --detach --name spiritvpn-ci-postgres --network spiritvpn-ci \
          --env POSTGRES_USER=spiritdb \
          --env POSTGRES_PASSWORD=test-password \
          --env POSTGRES_DB=spiritdb \
          postgres:14-alpine
        for attempt in $(seq 1 30); do
          if docker exec spiritvpn-ci-postgres pg_isready -U spiritdb; then
            exit 0
          fi
          sleep 1
        done
        docker logs spiritvpn-ci-postgres
        exit 1

    - name: Start backend and verify health
      run: |
        docker run --detach --name spiritvpn-ci-api --network spiritvpn-ci \
          --publish 127.0.0.1:18080:8080 \
          --env API_ADDRESS=:8080 \
          --env DB_HOST=spiritvpn-ci-postgres \
          --env DB_PORT=5432 \
          --env DB_USER=spiritdb \
          --env DB_PASSWORD=test-password \
          --env DB_NAME=spiritdb \
          --env INTERNAL_API_TOKEN=test-internal-token \
          --env VPN_HOST=vpn.example.test \
          --env VPN_PUBLIC_KEY=test-public-key \
          --env VPN_SHORT_IDS=0123456789abcdef \
          spiritvpn-api:ci
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:18080/health; then
            exit 0
          fi
          sleep 1
        done
        docker logs spiritvpn-ci-api
        exit 1

    - name: Print container logs
      if: always()
      run: |
        docker logs spiritvpn-ci-api 2>/dev/null || true
        docker logs spiritvpn-ci-postgres 2>/dev/null || true

  publish-backend:
    name: Publish Backend Image
    runs-on: ubuntu-latest
    needs: [container-smoke]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate immutable image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/spiritvpn-backend
        tags: |
          type=sha,format=long
          type=ref,event=branch

    - name: Build and publish backend
      uses: docker/build-push-action@v6
      with:
        context: .
        file: deployments/api.Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
