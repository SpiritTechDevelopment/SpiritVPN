name: CI/CD Pipeline

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Гейт интеграционных тестов адаптера postgres. Без обеих переменных они
      # пропускаются, и `go test ./...` остаётся офлайновым.
      SPIRITVPN_INTEGRATION_TESTS: "1"
      DATABASE_URL: "postgres://spiritdb:your_secure_password@localhost:5432/spiritdb?sslmode=disable"

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: spiritdb
          POSTGRES_PASSWORD: your_secure_password
          POSTGRES_DB: spiritdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spiritdb -d spiritdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Restore coverage cache
      uses: actions/cache/restore@v5
      with:
        path: coverage_cache.txt
        key: coverage-${{ github.ref }}-
        restore-keys: |
          coverage-${{ github.ref }}-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: |
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        # protobuf и sqlc генерируются и проверяются на расхождение в job build;
        # их statements не относятся к покрытию поддерживаемого вручную кода.
        awk 'NR == 1 || ($0 !~ /\/internal\/gen\// && $0 !~ /\/internal\/postgres\/db\//)' \
          coverage.out > coverage.filtered.out
        mv coverage.filtered.out coverage.out

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        fail_ci_if_error: false
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

    - name: Generate coverage report
      run: go tool cover -html=coverage.out -o coverage.html

    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      with:
        name: coverage-report
        path: coverage.html

    # Гейт, а не предупреждение. Стоит ПОСЛЕ выгрузки отчёта намеренно: падение
    # шага пропускает все последующие без `if: always()`, и отчёт исчезал бы
    # ровно тогда, когда по нему надо разбираться, почему покрытие просело.
    #
    # Порог относится к поддерживаемому вручную коду: сгенерированные protobuf
    # и sqlc исключены при подготовке профиля. Интеграционные тесты в этой job
    # включены; без них покрытие postgres не отражает реальные пути адаптера.
    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        # Пустая строка здесь означала бы, что профиль не разобрался; без этой
        # проверки `bc` получает пустое выражение, и гейт молча пропускает.
        if [ -z "$COVERAGE" ]; then
          echo "Failed to parse total coverage from coverage.out"
          exit 1
        fi
        echo "Current coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          echo "Coverage $COVERAGE% is below the 80% threshold"
          exit 1
        fi
        echo "Great! Coverage $COVERAGE% meets the 80% threshold"

    - name: Send coverage report to Telegram
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
        PREV_COVERAGE=""
        if [ -f coverage_cache.txt ]; then
          PREV_COVERAGE=$(cat coverage_cache.txt)
        fi
        echo "$COVERAGE" > coverage_cache.txt
        STATUS="Passed"
        if [ "${{ job.status }}" != "success" ]; then
          STATUS="Failed"
        fi
        if [ "$COVERAGE" == "$PREV_COVERAGE" ] && [ -n "$PREV_COVERAGE" ] && [ "$STATUS" == "Passed" ]; then
          exit 0
        fi
        if [ -n "${{ github.head_ref }}" ]; then
          BRANCH="${{ github.head_ref }} → ${{ github.base_ref }}"
        else
          BRANCH="${GITHUB_REF#refs/heads/}"
        fi
        COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
        COMMIT_SHA=${GITHUB_SHA::7}
        COVERAGE_CHANGE=""
        if [ -n "$PREV_COVERAGE" ]; then
          PREV_NUM=$(echo "$PREV_COVERAGE" | sed 's/%//')
          CURR_NUM=$(echo "$COVERAGE" | sed 's/%//')
          DIFF=$(echo "$CURR_NUM - $PREV_NUM" | bc)
          if (( $(echo "$DIFF > 0" | bc -l) )); then
            COVERAGE_CHANGE=" +${DIFF}%"
          elif (( $(echo "$DIFF < 0" | bc -l) )); then
            COVERAGE_CHANGE=" ${DIFF}%"
          fi
        fi
        MESSAGE=$'*Coverage Report*\n\n*Project:* SpiritVPN\n*Branch:* '"$BRANCH"$'\n*Commit:* '"$COMMIT_SHA"$'\n*Coverage:* '"$COVERAGE$COVERAGE_CHANGE"$'\n*Status:* '"$STATUS"$'\n\n_'"$COMMIT_MSG"$'_\n\n[View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" -d message_thread_id="18" -d text="${MESSAGE}" -d parse_mode="Markdown"
        fi

    - name: Save coverage cache
      if: always()
      uses: actions/cache/save@v5
      with:
        path: coverage_cache.txt
        key: coverage-${{ github.ref }}-${{ github.sha }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Build all packages
      run: go build -v ./...

    - name: Verify protobuf generated code is up to date
      run: |
        go tool buf lint
        go tool buf generate
        git diff --exit-code -- internal/gen

    - name: Verify sqlc generated code is up to date
      run: |
        go tool sqlc generate
        git diff --exit-code -- internal/postgres/db

  images:
    name: Images
    runs-on: ubuntu-latest
    needs: [build]

    # Единственная линия — main: каждый её коммит собирается и едет в среду
    # develop. Тег продвигает уже собранное в prod.
    #
    # Тег не пересобирает. Пересборка того же коммита может дать другие байты:
    # обновился базовый образ, разрешилась другая версия зависимости, поменялся
    # тулчейн. В прод обязаны уехать те байты, что проверялись в develop,
    # поэтому релизный тег перевешивается на существующий digest.
    #
    # Промежуточной ветки нет намеренно. С ней тег вставал бы на коммит,
    # созданный слиянием, — а такой коммит никогда не собирался, и продвижение
    # не нашло бы образ. Интерфейс GitHub слить с сохранением SHA не умеет:
    # merge, squash и rebase создают новые SHA все три.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write

    # Шаги сборки и продвижения взаимоисключающие: пропущенный даёт пустую
    # строку, и `||` выбирает тот, который отработал.
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      backend_repository: ${{ steps.target.outputs.backend_repository }}
      migrate_repository: ${{ steps.target.outputs.migrate_repository }}
      backend_digest: ${{ steps.build_backend.outputs.digest || steps.promote.outputs.backend_digest }}
      migrate_digest: ${{ steps.build_migrate.outputs.digest || steps.promote.outputs.migrate_digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # merge-base нужен полный граф коммитов; по умолчанию клон поверхностный.
        fetch-depth: 0

    # Тег обязан стоять на коммите, уже прошедшем main. Иначе в прод можно было
    # бы отправить ветку, которую никто не смотрел.
    - name: Validate release tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        set -euo pipefail
        printf '%s' "$GITHUB_REF_NAME" \
          | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
        git fetch --no-tags origin main
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main

    - name: Resolve target
      id: target
      run: |
        set -euo pipefail
        # Имена образов в ghcr обязаны быть строчными, а владелец репозитория
        # записан как SpiritTechDevelopment.
        owner=${GITHUB_REPOSITORY_OWNER,,}
        echo "backend_repository=ghcr.io/${owner}/spiritvpn-spiritvpnd" >> "$GITHUB_OUTPUT"
        echo "migrate_repository=ghcr.io/${owner}/spiritvpn-migrate" >> "$GITHUB_OUTPUT"
        # main — это среда develop; тег — prod. До else доходит только тег:
        # остальное отсечено условием job'а.
        if [ "$GITHUB_REF" = refs/heads/main ]; then
          echo "environment=develop" >> "$GITHUB_OUTPUT"
        else
          echo "environment=prod" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Оба образа выходят из одной стадии сборки и несут один тег. Разъехавшиеся
    # теги дают процесс, застрявший в `not ready: schema`, причём ни одна
    # миграция при этом не падает: он требует схему не ниже встроенной в него.
    - name: Build and push migrate
      id: build_migrate
      if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v6
      with:
        context: .
        target: migrate
        push: true
        tags: ${{ steps.target.outputs.migrate_repository }}:sha-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: mode=max
        sbom: true

    - name: Build and push spiritvpnd
      id: build_backend
      if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v6
      with:
        context: .
        target: spiritvpnd
        push: true
        tags: ${{ steps.target.outputs.backend_repository }}:sha-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: mode=max
        sbom: true

    # Перевешивание тега на существующий манифест: ничего не собирается и не
    # скачивается. Сверка digest'ов до и после превращает это из предположения
    # в проверенный факт.
    - name: Promote tested images
      id: promote
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        BACKEND: ${{ steps.target.outputs.backend_repository }}
        MIGRATE: ${{ steps.target.outputs.migrate_repository }}
      run: |
        set -euo pipefail
        promote() {
          local image=$1 source target source_digest target_digest
          source="${image}:sha-${GITHUB_SHA}"
          target="${image}:${GITHUB_REF_NAME}"
          source_digest=$(docker buildx imagetools inspect "$source" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)
          if [ -z "$source_digest" ]; then
            echo "образ ${source} не найден: коммит не собирался на main" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$target" "$source"
          target_digest=$(docker buildx imagetools inspect "$target" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)
          if [ "$source_digest" != "$target_digest" ]; then
            echo "продвижение изменило digest: ${source_digest} -> ${target_digest}" >&2
            exit 1
          fi
          printf '%s' "$source_digest"
        }
        echo "backend_digest=$(promote "$BACKEND")" >> "$GITHUB_OUTPUT"
        echo "migrate_digest=$(promote "$MIGRATE")" >> "$GITHUB_OUTPUT"

  # Выкаток отсюда больше нет. Этот репозиторий производит образы и сообщает их
  # digest'ы; какая версия работает в среде — записано в desired state
  # инфраструктуры и меняется коммитом туда. Здесь нет ни ключа от сервера, ни
  # знания о том, где он стоит.
  #
  # Событие несёт факт «образ опубликован», а не команду на выкатку: что из
  # этого следует, решает принимающая сторона.
  notify-infrastructure:
    name: Notify infrastructure
    runs-on: ubuntu-latest
    needs: [images]
    steps:
    - name: Dispatch the control release
      env:
        GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        ENVIRONMENT: ${{ needs.images.outputs.environment }}
        BACKEND_REPOSITORY: ${{ needs.images.outputs.backend_repository }}
        BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
        MIGRATE_REPOSITORY: ${{ needs.images.outputs.migrate_repository }}
        MIGRATE_DIGEST: ${{ needs.images.outputs.migrate_digest }}
      run: |
        set -euo pipefail
        # Пустой digest означает, что ни сборка, ни продвижение не отработали.
        # Отправлять неполное событие нельзя: принимающая сторона запишет его в
        # desired state.
        test -n "$BACKEND_DIGEST"
        test -n "$MIGRATE_DIGEST"
        # jq сам экранирует значения; сборка JSON конкатенацией строк ломается
        # на первом же неожиданном символе.
        jq -n \
          --arg environment "$ENVIRONMENT" \
          --arg source_git_sha "$GITHUB_SHA" \
          --arg backend_repository "$BACKEND_REPOSITORY" \
          --arg backend_digest "$BACKEND_DIGEST" \
          --arg migration_repository "$MIGRATE_REPOSITORY" \
          --arg migration_digest "$MIGRATE_DIGEST" \
          '{event_type: "control-release", client_payload: {
              environment: $environment,
              source_git_sha: $source_git_sha,
              backend: {repository: $backend_repository, digest: $backend_digest},
              migration: {repository: $migration_repository, digest: $migration_digest}}}' \
          | gh api repos/SpiritTechDevelopment/Infrastructure/dispatches \
              --method POST --input -
