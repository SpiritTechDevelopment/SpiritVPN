version: v2
managed:
  enabled: true
  override:
    # Сгенерированный Go живёт внутри этого модуля; снаружи его никто не импортирует.
    - file_option: go_package_prefix
      value: github.com/RomanRyabinkin/SpiritVPN/internal/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: internal/gen
    opt: paths=source_relative
