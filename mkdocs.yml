site_name: SpiritVPN Documentation
site_description: Документация backend-сервиса управления VPN-инфраструктурой SpiritVPN
site_author: Roman Ryabinkin, Pavel Lensky

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Включить тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Включить светлую тему
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

nav:
  - Главная: index.md
  - Архитектура:
      - Общая архитектура: ARCHITECTURE.md
      - Внешний API: API.md
      - База данных: DATABASE.md
      - Infrastructure manifest: MANIFEST.md
      - VLESS URI: VLESS.md
  - Разработка:
      - Руководство по тестированию: TESTING.md
      - Правила Changelog: CHANGELOG_GUIDE.md
  - Инфраструктура:
      - Развёртывание: DEPLOYMENT.md
      - Эксплуатация: OPERATIONS.md
